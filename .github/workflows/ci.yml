name: coreos-ci
on:
  push:
  pull_request:
jobs:
  codeql-security-review:
    name: CodeQL security-extended (third-party static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble actual runtime for independent CodeQL source analysis
        run: |
          python3 scripts/build_release.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('src')
          parts=sorted(root.glob('runtime.part*.ts'))
          assert len(parts)>=3, 'Expected split canonical runtime'
          data=b''.join(p.read_bytes() for p in parts)
          (root/'runtime.security.ts').write_bytes(data)
          for p in parts:
              p.rename(p.with_suffix('.sourcefrag'))
          legacy=root/'runtime.ts'
          if legacy.exists():
              legacy.rename(root/'runtime.legacy-source')
          print('MAX04_CODEQL_CANONICAL_RUNTIME_SHA256',hashlib.sha256(data).hexdigest())
          print('MAX04_CODEQL_SPLIT_PARTS',len(parts))
          PY
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze TypeScript security
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository checks
        run: python3 tests/repository_checks.py
      - name: Capability planner unit tests
        run: bun test tests/unit/*.test.ts
      - name: Deterministic release build
        run: |
          python3 scripts/build_release.py
          cp dist/coreos-1.2.0-rc.1.ts /tmp/first.ts
          python3 scripts/build_release.py
          cmp /tmp/first.ts dist/coreos-1.2.0-rc.1.ts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild identical artifact under Python 3.13
        run: |
          python3 scripts/build_release.py
          cmp /tmp/first.ts dist/coreos-1.2.0-rc.1.ts
  isolated-qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qual
          POSTGRES_PASSWORD: qual_local_only
          POSTGRES_DB: coreos_qual
        ports: 
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qual -d coreos_qual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://qual:qual_local_only@127.0.0.1:5432/coreos_qual
      COREOS_AUTH_SECRET: coreos_ci_qualification_only_secret_1234567890abcdef
      COREOS_BOOTSTRAP_SQL: '1'
      PORT: '34123'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate artifact
        run: python3 scripts/build_release.py
      - name: Isolated HTTP security and restart
        run: bun run qualification/isolated-gate.ts
      - name: MAX03 concurrency safety falsification
        run: bun run qualification/max03-concurrency-gate.ts
      - name: MAX04 cancellation/start race falsification
        run: bun run qualification/max04-cancel-race.ts
      - name: MAX04 disposable PostgreSQL outage and reconnect
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bun run qualification/max04-db-fault.ts
      - name: MAX03 preregistered load and graph/payload limits
        run: bun run qualification/max03-load-gate.ts
